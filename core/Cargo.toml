[package]
name = "boardstudio_core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
# Integration tests are listed below so the per-file tests link as one binary.
autotests = false

[[example]]
name = "core_request"
required-features = ["wire-json"]

[[example]]
name = "prepare_case"
required-features = ["wire-json"]

[[example]]
name = "dump_firmware"

[features]
wire-json = ["boardstudio-model/wire-json", "boardstudio-core-engine/wire-json"]

[dependencies]
boardstudio-core-artifact = { path = "crates/artifact" }
boardstudio-core-engine = { path = "crates/engine" }
boardstudio-core-kernel = { path = "crates/kernel" }
boardstudio-core-mechanical = { path = "crates/mechanical" }
boardstudio-model = { path = "crates/model" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

[dev-dependencies]
boardstudio-core-engine = { path = "crates/engine", features = ["wire-json"] }
boardstudio-footprints = { path = "../footprints" }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "=0.11.0", default-features = false }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "integration_matrix"
path = "tests/integration_matrix.rs"

[[test]]
name = "integration_mechanical"
path = "tests/integration_mechanical.rs"

[[test]]
name = "integration_modules"
path = "tests/integration_modules.rs"

[lints]
workspace = true
