[package]
name = "boardstudio_core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Integration tests are listed below so the per-file tests link as one binary.
autotests = false

[[example]]
name = "dump_firmware"

[dependencies]
boardstudio-contracts = { path = "../contracts/rust" }
boardstudio-footprints = { path = "../footprints" }
i_overlay = "9.0.0"
kiutils_sexpr = "=0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.0", default-features = false }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rhai = { version = "1.26.1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { version = "1.26.1", default-features = false, features = ["std", "wasm-bindgen"] }

[dev-dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "performance"
path = "tests/performance.rs"

[[test]]
name = "matrix_performance"
path = "tests/matrix_performance.rs"
