[package]
name = "boardstudio-core-mirrored-half"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "BoardStudio Core canonical mirror projection."

[dependencies]
boardstudio-model = { path = "../model" }

[dev-dependencies]
# float_roundtrip matches the page runtime so format-8 JSON round-trips bit-exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
