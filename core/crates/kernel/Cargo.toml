[package]
name = "boardstudio-core-kernel"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "BoardStudio Core matrix layout kernel, constraint resolution and outline geometry."

[dependencies]
boardstudio-model = { path = "../model" }
boardstudio-core-mirrored-half = { path = "../mirrored-half" }
boardstudio-contracts = { path = "../../../contracts/rust" }
boardstudio-footprints = { path = "../../../footprints" }
i_overlay = "9.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true
