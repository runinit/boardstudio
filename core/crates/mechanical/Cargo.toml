[package]
name = "boardstudio-core-mechanical"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "BoardStudio Core mechanical resolution: profiles, assembly features, gaskets, halves and edit application."

[dependencies]
boardstudio-model = { path = "../model" }
boardstudio-core-kernel = { path = "../kernel" }
boardstudio-core-kicad-source = { path = "../kicad-source" }
boardstudio-core-modules = { path = "../modules" }
boardstudio-contracts = { path = "../../../contracts/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
boardstudio-core-engine = { path = "../engine" }
boardstudio-script = { path = "../script" }

[lints]
workspace = true
