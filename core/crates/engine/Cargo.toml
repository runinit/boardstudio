[package]
name = "boardstudio-core-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
# Exposes test-only windows onto private mirrored-half helpers for sibling crates' tests.
test-support = []

[dependencies]
boardstudio-model = { path = "../model" }
boardstudio-core-kernel = { path = "../kernel" }
boardstudio-core-kicad-source = { path = "../kicad-source" }
boardstudio-core-modules = { path = "../modules" }
boardstudio-core-electrical = { path = "../electrical" }
boardstudio-core-mechanical = { path = "../mechanical" }
boardstudio-core-artifact = { path = "../artifact" }
boardstudio-core-mirrored-half = { path = "../mirrored-half" }
boardstudio-contracts = { path = "../../../contracts/rust" }
i_overlay = "9.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
boardstudio-script = { path = "../script" }

[lints]
workspace = true
