[package]
name = "boardstudio-core-electrical"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "BoardStudio Core electrical planning: wiring resolution, peripheral requirements and keymap edits."

[dependencies]
boardstudio-model = { path = "../model" }
boardstudio-core-kernel = { path = "../kernel" }
boardstudio-core-modules = { path = "../modules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
