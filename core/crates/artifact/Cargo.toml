[package]
name = "boardstudio-core-artifact"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "BoardStudio Core stateless artifact operations: KiCad generation, module import and mechanical plates."

[features]
# JSON wire codecs (`artifact::request`, artifact-only serde) are test-only entry
# points; production callers use the typed `artifact::handle` path.
wire-json = ["boardstudio-model/wire-json"]

[dependencies]
boardstudio-model = { path = "../model" }
boardstudio-core-kernel = { path = "../kernel" }
boardstudio-core-kicad-source = { path = "../kicad-source" }
boardstudio-core-mechanical = { path = "../mechanical" }
boardstudio-contracts = { path = "../../../contracts/rust" }
boardstudio-footprints = { path = "../../../footprints" }
kiutils_sexpr = "=0.1.1"
serde_json = "1"

[dev-dependencies]
boardstudio-core-artifact = { path = ".", features = ["wire-json"] }

[lints]
workspace = true
