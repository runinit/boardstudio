[package]
name = "boardstudio-footprints"
version = "0.1.0"
edition = "2024"
publish = false
# Mixed: the framework is MIT OR Apache-2.0, the ported generators are MIT or
# CC-BY-NC-SA-4.0 as marked per file. See NOTICE.md.
license = "(MIT OR Apache-2.0) AND CC-BY-NC-SA-4.0"

[lib]
name = "boardstudio_footprints"
path = "src/lib.rs"

[dependencies]
boardstudio-contracts = { path = "../contracts/rust" }
libm = "0.2.16"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parameter values and fixtures must parse to the exact nearest
# double, as JavaScript does; the default parser can be one ulp off.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# Fixtures are read with their key order so schema order can be checked.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true
