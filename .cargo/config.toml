# Parallel rustc jobs for every cargo, wasm-pack and dx build. An explicit
# CARGO_BUILD_JOBS in the environment still overrides this default.
[build]
jobs = 12

# wasm-bindgen-test bounds one test-binary run at 20 seconds by default, which a broad
# mounted batch exceeds once the wasm module load is counted. Two minutes is the bound
# scripts/run-wasm-tests.py already sets for its batches and README.md documents; an
# explicit WASM_BINDGEN_TEST_TIMEOUT in the environment still overrides this default.
[env]
WASM_BINDGEN_TEST_TIMEOUT = "120"

# dx adds `--cfg getrandom_backend="wasm_js"` to its wasm builds. Setting it here gives wasm-pack,
# cargo test and Clippy the same flags, so they reuse the page build's units; build-web.py,
# dev-web.py and check.py run dx with `--wasm-js-cfg false` so it isn't added twice.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
