# cargo-deny policy for the root workspace (`python3 scripts/check.py deny`).
# Advisories are covered by cargo-audit in the separate security workflow, so they are not repeated.
# The separate CAD workspace uses its own policy in cad/deny.toml.

[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "Zlib", "CC0-1.0", "Unicode-3.0"]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
# The workspace crates are `publish = false`. footprints' CC-BY-NC-SA data license is its own
# decision and is not a dependency policy question.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/DioxusLabs/dioxus-components", "https://github.com/asny/three-d"]
