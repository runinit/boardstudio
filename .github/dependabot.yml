version: 2
updates:
  - package-ecosystem: cargo
    directories: [/core, /application, /renderer, /cad/wasm, /web, /contracts/rust]
    schedule:
      interval: weekly
    groups:
      wasm-bindings:
        patterns: [wasm-bindgen, wasm-bindgen-*, js-sys, web-sys]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
