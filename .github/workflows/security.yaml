name: Dependency security
on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: pnpm run check:security
      - name: Validate patched matrix operations with Miri
        run: |
          rustup toolchain install nightly-2026-08-12 --profile minimal --component miri,rust-src
          cargo +nightly-2026-08-12 miri test --manifest-path renderer/vendor/cgmath-0.18.0/Cargo.toml --locked --test security_swaps
