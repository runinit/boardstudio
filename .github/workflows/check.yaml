name: Validate Board Studio
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Serialize release validation, build and deploy together; unrelated checks keep their own group.
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'pages' || format('validation-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  # Native test binaries link Core many times; full debuginfo made them (and the cache) several
  # times larger and slower to link. Line tables keep file:line in panics and backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  # Native Rust tests (including KiCad and native CAD checks). Runs beside `web` so the KiCad
  # install is off the critical path.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli version | grep '^10\.'
      - run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11), sys.version'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            cad/monstertruck -> target
            cad/wasm -> target
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - run: python3 scripts/check.py repo tooling lint test

  # Release build and mounted browser tests.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11), sys.version'
      - uses: ./.github/actions/web-tools
      # wasm-pack's own tool cache (wasm-bindgen CLI and test runner, wasm-opt).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-0.15.0-wasm-bindgen-0.2.129
      # Keep the drag browser separate from system Chrome and ChromeDriver.
      - name: Provision Rust drag-smoke Chrome
        run: scripts/install-drag-chrome.sh "$RUNNER_TEMP/drag-chrome"
      - name: Verify headless Chrome tools
        run: |
          google-chrome --version
          chromedriver --version
      - name: Verify Rust browser checks need no Playwright
        run: |
          env -u NODE_PATH node -e "for (const name of ['playwright', 'playwright-core']) { try { require.resolve(name); throw Error(name + ' unexpectedly installed'); } catch (e) { if (e.code !== 'MODULE_NOT_FOUND') throw e; } }"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            cad/wasm -> target
          shared-key: web
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Build and check web
        run: env -u NODE_PATH python3 scripts/check.py build browser
        env:
          BOARDSTUDIO_DRAG_DRIVER: rust
          BOARDSTUDIO_DRAG_CHROME_BIN: ${{ runner.temp }}/drag-chrome/chrome-linux64/chrome
      - name: Verify drag consumer failures (Linux)
        run: python3 scripts/test-drag-browser-consumer-controls.py
        env:
          CHROME_BIN: ${{ runner.temp }}/drag-chrome/chrome-linux64/chrome
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure
          path: web/target/test-results
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: drag-browser-receipts
          path: web/target/test-results/drag-browser/*/receipt.json
          if-no-files-found: ignore
          retention-days: 7

  # Release build and Pages deploy, moved here from the deleted `pages` workflow so a commit
  # reaches users only after the native and web validation jobs of the same commit pass.
  # The gate below allows a push to `main` and a manual dispatch; pull requests and pushes to
  # `dev` validate but never release.
  release-build:
    needs: [native, web]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11), sys.version'
      - uses: ./.github/actions/web-tools
      # wasm-pack's own tool cache (wasm-bindgen CLI and test runner, wasm-opt).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-0.15.0-wasm-bindgen-0.2.129
      # Restores the cache the `web` job saves on main; never saves its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            cad/wasm -> target
          shared-key: web
          save-if: false
      - name: Build the Dioxus release package (/boardstudio/ route)
        run: python3 scripts/build-web.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/target/site/site-subpath/boardstudio

  release-deploy:
    needs: release-build
    if: needs.release-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
