name: Validate Board Studio
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli version | grep '^10\.'
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked --version 0.15.0
      - run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11), sys.version'
      - run: cargo install dioxus-cli --locked --version 0.7.10
      - name: Verify headless Chrome tools
        run: |
          google-chrome --version
          chromedriver --version
      - run: python3 scripts/check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure
          path: web/target/test-results
          retention-days: 7
