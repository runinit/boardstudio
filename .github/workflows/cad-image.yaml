name: Publish CAD toolchain image
# Builds cad/wasm/Containerfile (wasi-sdk sysroot from source) once and publishes it, so CI
# and contributors pull it instead of rebuilding. The tag is derived from the
# Containerfile's content by cad/scripts/cadrum_build.py::registry_image().
on:
  push:
    branches: [main, dev]
    paths:
      - cad/wasm/Containerfile
      - cad/scripts/cadrum_build.py
      - .github/workflows/cad-image.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: image
        run: |
          image=$(python3 -c 'import sys; sys.path.insert(0, "cad/scripts"); import cadrum_build; print(cadrum_build.registry_image())')
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: published
        run: |
          if docker manifest inspect "${{ steps.image.outputs.ref }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.image.outputs.ref }} is already published"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.published.outputs.exists != 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.published.outputs.exists != 'true'
        with:
          context: cad
          file: cad/wasm/Containerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
