name: Deploy Board Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11), sys.version'
      - uses: ./.github/actions/web-tools
      # wasm-pack's own tool cache (wasm-bindgen CLI and test runner, wasm-opt).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-0.15.0-wasm-bindgen-0.2.129
      # Restores the cache the `web` job of check.yaml saves on main; never saves its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: web
          save-if: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cad/.cache/cadrum/*/*.tar.gz
            cad/.cache/cargo-registry
            cad/.cache/cargo-git
          key: cadrum-wasm-${{ hashFiles('cad/scripts/cadrum_build.py', 'cad/wasm/Cargo.lock') }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Dioxus release package (/boardstudio/ route)
        run: python3 scripts/build-web.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/target/site/site-subpath/boardstudio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
