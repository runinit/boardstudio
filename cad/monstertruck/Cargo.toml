[package]
name = "boardstudio-cad"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["../wasm"]

[lib]
crate-type = ["rlib"]

[dependencies]
cavalier_contours = "=0.9.0"
monstertruck-assembly = "=0.4.1"
boardstudio-contracts = { path = "../../contracts/rust" }
monstertruck-io = { version = "=0.4.1", default-features = false, features = ["step"] }
monstertruck-meshing = { version = "=0.4.1", default-features = false, features = ["tessellation", "analyzers"] }
monstertruck-modeling = { version = "=0.4.1", default-features = false }
monstertruck-topology = "=0.4.1"

num-rational = { version = "=0.4.2", features = ["num-bigint"] }
num-traits = "=0.2.19"
step-p21 = "=0.1.1"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[patch.crates-io]
cgmath = { path = "../../renderer/vendor/cgmath-next-0.18.1" }
Inflector = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
monstertruck-core = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
monstertruck-derive = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
monstertruck-geometry = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
monstertruck-io = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
monstertruck-mesh = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
monstertruck-meshing = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
monstertruck-modeling = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
monstertruck-traits = { git = "https://github.com/runinit/monstertruck-boardstudio", rev = "7b989e019b64ccc93be82fe4a329d944c6df38c4" }
