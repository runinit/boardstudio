[package]
name = "boardstudio-cadrum-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boardstudio-contracts = { path = "../../contracts/rust" }
cadrum = { version = "=0.8.20", default-features = false }
js-sys = "=0.3.106"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.129"

ttf-parser = "=0.25.1"

[dev-dependencies]
serde_json = "=1.0.151"
