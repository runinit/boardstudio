[package]
name = "boardstudio-cad"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
cadmpeg-codec-step = "=0.6.12"
cadmpeg-ir = "=0.6.12"
cadmpeg-tessellate = "=0.6.12"
cavalier_contours = "=0.9.0"
cgmath = "=0.18.0"
boardstudio-contracts = { path = "../../contracts/rust" }

num-rational = { version = "=0.4.2", features = ["num-bigint"] }
num-traits = "=0.2.19"
spade = "=2.15.1"
step-p21 = "=0.1.1"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
