# cargo-deny policy for the separate CAD workspace (`cd cad && cargo deny --locked check licenses bans sources`).
# Advisories are covered by cargo-audit in the separate security workflow.

[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Zlib", "CC0-1.0", "Unicode-3.0"]
confidence-threshold = 0.9
exceptions = [
    # CAD transitive dependency for printable keycap geometry.
    { allow = ["BSL-1.0"], crate = "clipper2-rust@=1.2.0" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
