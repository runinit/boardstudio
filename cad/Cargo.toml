[workspace]
resolver = "3"
members = [
    "core",
    "wasm",
]
exclude = [
    "vendor/cadmpeg-tessellate",
    "vendor/inflector",
]

[profile.cad-test]
inherits = "dev"
opt-level = 1
debug = false
incremental = false

[profile.cad-test.package.manifold-rust]
opt-level = 2

[profile.cad-test.package.parry3d-f64]
opt-level = 2

[profile.cad-test.package.spade]
opt-level = 2

[profile.cad-test.package.glam]
opt-level = 2

[profile.cad-test.package.wide]
opt-level = 2

[profile.cad-test.package.lyon_tessellation]
opt-level = 2

[profile.cad-test.package.cadmpeg-codec-step]
opt-level = 2

[profile.cad-test.package.cadmpeg-tessellate]
opt-level = 2

[patch.crates-io]
cadmpeg-tessellate = { path = "vendor/cadmpeg-tessellate" }
Inflector = { path = "vendor/inflector" }
cgmath = { path = "../renderer/vendor/cgmath-next-0.18.1" }
