[package]
name = "boardstudio-step-oracle"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test-only, native-only STEP reimport oracle: OCCT 8.0.1 STEPControl_Reader and BRepCheck_Analyzer behind a narrow CXX bridge"
# Its own workspace root. The repo root excludes this crate, but cargo still walks up past that
# exclusion into an enclosing checkout (a nested .worktrees/ checkout) and fails. See
# docs/plans/check-speed/issues/10-nested-worktrees.md.
[workspace]

[dependencies]
cxx = "=1.0.202"

[build-dependencies]
cxx-build = "=1.0.202"
