[package]
name = "Inflector"
version = "0.11.4"
edition = "2021"
description = "Minimal subset trimmed from Inflector 0.11.4 for step-p21 (to_pascal_case, to_screaming_snake_case)."
license = "BSD-2-Clause"
publish = false

[lib]
name = "inflector"
path = "src/lib.rs"

[features]
# step-p21 enables default features; keep them empty so regex/lazy_static
# stay out of the CAD trees (cold-build ticket 07).
default = []
heavyweight = []
