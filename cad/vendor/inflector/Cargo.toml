[package]
name = "Inflector"
version = "0.11.4"
edition = "2021"
description = "Zero-dependency STEP/Rust identifier case conversion (to_pascal_case, to_screaming_snake_case)."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "inflector"
path = "src/lib.rs"

[features]
# step-p21 enables default features; keep them empty so regex/lazy_static
# stay out of the CAD trees (cold-build ticket 07).
default = []
heavyweight = []
