[package]
name = "boardstudio-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
# The files in tests/ `#[path]`-include wasm-only presentation sources and do not build
# natively; `cargo test --workspace` must not try. Browser tests live in src/.
autotests = false

[lib]
name = "boardstudio_web"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "boardstudio-web"
path = "src/main.rs"
required-features = ["page"]

[features]
default = ["page", "core-worker"]
page = ["boardstudio-web-host/page", "dep:boardstudio-web-runtime", "dep:boardstudio-web-ui-model", "dep:boardstudio-web-catalogue", "dep:boardstudio-web-ui-shared", "dep:boardstudio-web-parts", "dep:boardstudio-web-case", "dep:boardstudio-web-keymap", "dep:boardstudio-web-library", "dep:boardstudio-web-keycaps", "dep:boardstudio-application", "dep:boardstudio_core", "dep:dioxus", "dep:dioxus-web", "dep:gloo-timers", "dep:serde_json", "dep:sha2"]
core-worker = ["dep:boardstudio_core", "dep:serde_json"]
cad-worker = ["boardstudio-web-host/cad-worker", "dep:boardstudio_core", "dep:serde_json", "dep:sha2"]
service-worker = []
test-harness = ["boardstudio-web-host/test-harness"]

[dependencies]
boardstudio-application = { path = "../application", optional = true }
boardstudio_core = { path = "../core", optional = true }
boardstudio-web-host = { path = "crates/host" }
boardstudio-web-runtime = { path = "crates/runtime", optional = true }
boardstudio-web-ui-model = { path = "crates/ui-model", optional = true }
boardstudio-web-catalogue = { path = "crates/catalogue", optional = true }
boardstudio-web-ui-shared = { path = "crates/ui-shared", optional = true }
boardstudio-web-parts = { path = "crates/parts", optional = true }
boardstudio-web-case = { path = "crates/case", optional = true }
boardstudio-web-keymap = { path = "crates/keymap", optional = true }
boardstudio-web-library = { path = "crates/library", optional = true }
boardstudio-web-keycaps = { path = "crates/keycaps", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
sha2 = { version = "=0.11.0", default-features = false, optional = true }

[dev-dependencies]
boardstudio-web-runtime = { path = "crates/runtime", features = ["test-support"] }
boardstudio-web-ui-model = { path = "crates/ui-model", features = ["test-support"] }
boardstudio-web-parts = { path = "crates/parts", features = ["test-support"] }
boardstudio-web-case = { path = "crates/case", features = ["test-support"] }
boardstudio-web-keymap = { path = "crates/keymap", features = ["test-support"] }
boardstudio-web-library = { path = "crates/library", features = ["test-support"] }
boardstudio-web-keycaps = { path = "crates/keycaps", features = ["test-support"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "mounted"], optional = true }
dioxus-web = { version = "=0.7.10", default-features = false, features = ["mounted"], optional = true }
gloo-timers = { version = "=0.3.0", features = ["futures"], optional = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"
futures-channel = "=0.3.34"
web-sys = { version = "=0.3.106", features = [
  "DedicatedWorkerGlobalScope", "DomException", "ErrorEvent", "Event", "EventInit", "EventTarget", "MessageEvent", "KeyboardEventInit", "CssStyleDeclaration",
  "Worker", "WorkerOptions", "WorkerType", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest",
  "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStoreParameters", "Storage", "Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlCanvasElement", "SvgElement", "PointerEvent", "KeyboardEvent", "FocusOptions", "DomRect", "Response", "Request", "Blob", "BlobPropertyBag", "Url", "Location", "Node", "File", "FileList", "HtmlInputElement", "ResizeObserver", "MediaQueryList",
  "Cache", "CacheStorage", "ExtendableEvent", "FetchEvent", "Clients", "ServiceWorkerContainer",
  "ServiceWorkerGlobalScope", "ServiceWorkerRegistration", "WorkerGlobalScope", "Navigator", "RegistrationOptions", "RequestDestination", "HtmlDialogElement"
] }

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "0.3.79"


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[[example]]
name = "case-settings"
required-features = ["page"]
