[package]
name = "boardstudio-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "boardstudio_web"
crate-type = ["cdylib", "rlib"]

[features]
default = ["page", "core-worker"]
page = ["dep:boardstudio_core", "dep:dioxus", "dep:dioxus-web", "dep:gloo-timers"]
core-worker = ["dep:boardstudio_core"]
test-harness = []

[dependencies]
boardstudio_core = { path = "../core", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "mounted"], optional = true }
dioxus-web = { version = "=0.7.10", default-features = false, features = ["mounted"], optional = true }
gloo-timers = { version = "=0.3.0", features = ["futures"], optional = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"
futures-channel = "=0.3.34"
web-sys = { version = "=0.3.106", features = [
  "DedicatedWorkerGlobalScope", "DomException", "ErrorEvent", "Event", "EventTarget", "MessageEvent",
  "Worker", "WorkerOptions", "WorkerType", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest",
  "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStoreParameters", "Storage", "Window"
] }
