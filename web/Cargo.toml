[package]
name = "boardstudio-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "boardstudio_web"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "boardstudio-web"
path = "src/main.rs"
required-features = ["page"]

[features]
default = ["page", "core-worker"]
page = ["dep:boardstudio-application", "dep:boardstudio_core", "dep:dioxus", "dep:dioxus-web", "dep:gloo-timers", "dep:serde_json", "dep:sha2"]
core-worker = ["dep:boardstudio_core", "dep:serde_json"]
service-worker = []
test-harness = []

[dependencies]
boardstudio-application = { path = "../application", optional = true }
boardstudio_core = { path = "../core", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
sha2 = { version = "=0.11.0", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "mounted"], optional = true }
dioxus-web = { version = "=0.7.10", default-features = false, features = ["mounted"], optional = true }
gloo-timers = { version = "=0.3.0", features = ["futures"], optional = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"
futures-channel = "=0.3.34"
web-sys = { version = "=0.3.106", features = [
  "DedicatedWorkerGlobalScope", "DomException", "ErrorEvent", "Event", "EventTarget", "MessageEvent",
  "Worker", "WorkerOptions", "WorkerType", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest",
  "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStoreParameters", "Storage", "Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlCanvasElement", "SvgElement", "PointerEvent", "KeyboardEvent", "FocusOptions", "DomRect", "Response", "Request", "Blob", "BlobPropertyBag", "Url", "Location", "Node", "File", "FileList", "HtmlInputElement", "ResizeObserver", "MediaQueryList",
  "Cache", "CacheStorage", "ExtendableEvent", "FetchEvent", "Clients", "ServiceWorkerContainer",
  "ServiceWorkerGlobalScope", "ServiceWorkerRegistration", "WorkerGlobalScope", "Navigator", "RegistrationOptions", "RequestDestination"
] }

[build-dependencies]
serde_json = "1"
