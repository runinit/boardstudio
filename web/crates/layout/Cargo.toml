[package]
name = "boardstudio-web-layout"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "BoardStudio Layout workspace features: the objects tree and matrix tools, outlines, part placement, the layout viewer and findings, the board inspector and the setup guide."

[dependencies]
boardstudio-application = { path = "../../../application" }
boardstudio_core = { path = "../../../core" }
boardstudio-web-runtime = { path = "../runtime" }
boardstudio-web-ui-model = { path = "../ui-model" }
boardstudio-web-ui-shared = { path = "../ui-shared" }
boardstudio-web-catalogue = { path = "../catalogue" }
boardstudio-web-keycaps = { path = "../keycaps" }
boardstudio-web-case = { path = "../case" }
boardstudio-web-parts = { path = "../parts" }
boardstudio-web-layout-core = { path = "../layout-core" }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", package = "dioxus-primitives", default-features = false, features = ["web"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "mounted"] }
dioxus-web = { version = "=0.7.10", default-features = false, features = ["mounted"] }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
futures-channel = "=0.3.34"
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { workspace = true }

[dev-dependencies]
boardstudio-web-runtime = { path = "../runtime", features = ["test-support"] }
boardstudio-web-ui-model = { path = "../ui-model", features = ["test-support"] }
boardstudio-web-ui-shared = { path = "../ui-shared", features = ["test-support"] }
boardstudio-web-keycaps = { path = "../keycaps", features = ["test-support"] }
boardstudio-web-case = { path = "../case", features = ["test-support"] }
boardstudio-web-parts = { path = "../parts" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[lints]
workspace = true
