[package]
name = "boardstudio-web-ui-model"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "BoardStudio page UI vocabulary shared by every presentation crate: selection, tree contexts and workspace state."

[features]
# Exposes the context-providing helpers that other crates' browser tests mount.
test-support = []

[dependencies]
boardstudio-application = { path = "../../../application" }
boardstudio_core = { path = "../../../core" }
boardstudio-web-runtime = { path = "../runtime" }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["DomRect", "Element", "HtmlElement", "KeyboardEvent", "PointerEvent", "SvgElement", "Window"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
