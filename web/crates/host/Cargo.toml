[package]
name = "boardstudio-web-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Browser host services shared by the BoardStudio page and its workers: storage, Core and CAD worker clients, renderer host and offline policy."

[features]
# The page's host services (storage, Core client, renderer host, CAD job capture).
page = ["dep:boardstudio-application", "dep:boardstudio_core", "dep:serde_json", "dep:sha2"]
# The CAD worker's job protocol.
cad-worker = ["dep:boardstudio_core", "dep:serde_json", "dep:sha2"]
test-harness = []

[dependencies]
boardstudio-application = { path = "../../../application", optional = true }
boardstudio_core = { path = "../../../core", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
sha2 = { version = "=0.11.0", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "=0.3.0", features = ["futures"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"
futures-channel = "=0.3.34"
web-sys = { version = "=0.3.106", features = [
  "DedicatedWorkerGlobalScope", "DomException", "ErrorEvent", "Event", "EventInit", "EventTarget", "MessageEvent", "KeyboardEventInit", "CssStyleDeclaration",
  "Worker", "WorkerOptions", "WorkerType", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest",
  "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStoreParameters", "Storage", "Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlCanvasElement", "SvgElement", "PointerEvent", "KeyboardEvent", "FocusOptions", "DomRect", "Response", "Request", "Blob", "BlobPropertyBag", "Url", "Location", "Node", "File", "FileList", "HtmlInputElement", "ResizeObserver", "MediaQueryList",
  "Cache", "CacheStorage", "ExtendableEvent", "FetchEvent", "Clients", "ServiceWorkerContainer",
  "ServiceWorkerGlobalScope", "ServiceWorkerRegistration", "WorkerGlobalScope", "Navigator", "RegistrationOptions", "RequestDestination", "HtmlDialogElement"
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[lints]
workspace = true
