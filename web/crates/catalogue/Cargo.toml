[package]
name = "boardstudio-web-catalogue"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "BoardStudio bundled component catalogue: loading, generator normalization and physical setup proposals."

[features]
test-support = []

[dependencies]
boardstudio-core-kernel = { path = "../../../core/crates/kernel" }
boardstudio-core-mechanical = { path = "../../../core/crates/mechanical" }
boardstudio-model = { path = "../../../core/crates/model" }
boardstudio-web-host = { path = "../host", features = ["page"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
boardstudio_core = { path = "../../../core" }

[lints]
workspace = true
