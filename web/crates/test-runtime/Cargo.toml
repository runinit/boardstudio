[package]
name = "boardstudio-web-test-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
boardstudio-web-runtime = { path = "../runtime", features = ["test-support"] }
boardstudio_core = { path = "../../../core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
boardstudio-web-host = { path = "../host", features = ["page"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
futures-channel = "=0.3.34"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
boardstudio-application = { path = "../../../application" }
boardstudio-model = { path = "../../../core/crates/model" }

[lints]
workspace = true
