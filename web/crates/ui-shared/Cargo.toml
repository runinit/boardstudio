[package]
name = "boardstudio-web-ui-shared"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "BoardStudio page UI shared by workspaces: panels, canvas layers, footprint graphics and model import."

[features]
test-support = ["boardstudio-web-ui-model/test-support"]

[dependencies]
boardstudio-application = { path = "../../../application" }
boardstudio_core = { path = "../../../core" }
boardstudio-web-host = { path = "../host", features = ["page"] }
boardstudio-web-runtime = { path = "../runtime" }
boardstudio-web-ui-model = { path = "../ui-model" }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "mounted"] }
dioxus-web = { version = "=0.7.10", default-features = false, features = ["mounted"] }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
js-sys = "=0.3.106"
sha2 = { version = "=0.11.0", default-features = false }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
  "DedicatedWorkerGlobalScope", "DomException", "ErrorEvent", "Event", "EventInit", "EventTarget", "MessageEvent", "KeyboardEventInit", "CssStyleDeclaration",
  "Worker", "WorkerOptions", "WorkerType", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest",
  "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStoreParameters", "Storage", "Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlCanvasElement", "SvgElement", "PointerEvent", "KeyboardEvent", "FocusOptions", "DomRect", "Response", "Request", "Blob", "BlobPropertyBag", "Url", "Location", "Node", "File", "FileList", "HtmlInputElement", "ResizeObserver", "MediaQueryList",
  "Cache", "CacheStorage", "ExtendableEvent", "FetchEvent", "Clients", "ServiceWorkerContainer",
  "ServiceWorkerGlobalScope", "ServiceWorkerRegistration", "WorkerGlobalScope", "Navigator", "RegistrationOptions", "RequestDestination", "HtmlDialogElement"
] }

[dev-dependencies]
boardstudio-web-runtime = { path = "../runtime", features = ["test-support"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[lints]
workspace = true
