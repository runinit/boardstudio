[package]
name = "boardstudio-renderer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
i_overlay = "=9.0.0"
lyon_path = "=1.0.19"
lyon_tessellation = "=1.0.22"
serde = { version = "1", features = ["derive"] }
three-d = { version = "=0.20.0", git = "https://github.com/asny/three-d.git", rev = "0e5ece5fe124fa21b92fd96fe3e4bbb4357dbf03", default-features = false }
three-d-asset = { version = "=0.10.0", default-features = false, features = ["stl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.129"
# The workspace web-sys list and these leaf pins match the page and workers (see the wasm32 table in
# `web/Cargo.toml`), so every wasm build in the shared target directory reuses one copy of each.
web-sys = { workspace = true }
euclid = "=0.22.14"
futures-channel = { version = "=0.3.34", features = ["sink"] }
futures-sink = { version = "=0.3.34", default-features = false, features = ["std"] }
futures-core = "=0.3.34"
futures-util = { version = "=0.3.34", features = ["channel", "io", "sink"] }
num-traits = { version = "=0.2.19", features = ["i128", "libm"] }
once_cell = { version = "=1.21.4", features = ["portable-atomic"] }
serde = { version = "=1.0.229", features = ["alloc"] }
slab = "=0.4.12"
slotmap = { version = "=1.1.1", features = ["serde"] }

# No build script uses these; they give the renderer's proc macros the `syn` and `proc-macro2`
# features the page resolves (see `web/Cargo.toml`), so serde_derive and the units above it are shared.
[build-dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["extra-traits", "full", "visit", "visit-mut"] }

[lints]
workspace = true
