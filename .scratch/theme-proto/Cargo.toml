[package]
name = "theme-proto"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "mounted"] }
tw_merge = "0.1"
strum = { version = "0.28", features = ["derive"] }
icons = { version = "0.18", features = ["dioxus"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location", "History", "KeyboardEvent", "HtmlElement", "EventTarget"] }
