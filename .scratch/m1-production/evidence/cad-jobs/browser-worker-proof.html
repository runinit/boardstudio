<!doctype html>
<html><head><meta charset="utf-8"><title>M1 CAD Worker Proof</title></head>
<body><button id="run">Run browser proof</button><button id="flip">Run flipped REVIUNG STEP readback</button><pre id="out">Ready</pre>
<script type="module">
const out = document.querySelector('#out');
const log = (line) => { out.textContent += `\n${line}`; };
const json = async (path) => await (await fetch(path)).json();
const wait = (target, pred, timeout=180000) => new Promise((resolve,reject) => {
  const timer=setTimeout(()=>reject(new Error('worker response timeout')),timeout);
  const listener=(event)=>{ if(pred(event.data)){ clearTimeout(timer); target.removeEventListener('message',listener); resolve(event.data); } };
  target.addEventListener('message',listener);
});
function openCore() {
  const worker = new Worker('/assets/core-worker/entry.js',{type:'module'});
  const pending = new Map();
  let seq = 0;
  worker.addEventListener('message',event=>{
    if(event.data==='boardstudio-core-ready') return;
    if(event.data?.error){ const item=pending.get(event.data.request_id); if(item){pending.delete(event.data.request_id);item(new Error(event.data.error));} return; }
    if(event.data?.kind!=='core') return;
    const parsed=JSON.parse(event.data.frame);
    const item=pending.get(event.data.request_id);
    if(item){ pending.delete(event.data.request_id); item(parsed); }
  });
  const ready=wait(worker,data=>data==='boardstudio-core-ready');
  return {worker,ready,request:async(request)=>{
    const id=request.id || `proof-${++seq}`; request.id=id;
    const answer=new Promise((resolve,reject)=>{pending.set(id,reply=>reply instanceof Error?reject(reply):reply.kind==='error'?reject(new Error(reply.message)):resolve(reply));setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error(`CoreWorker request timed out: ${id}`));}},60000);});
    worker.postMessage({kind:'core',request_id:id,executor_epoch:'m1-cad-proof',frame:JSON.stringify(request)});
    return await answer;
  }};
}
function openCad(entry='/assets/cad-worker/entry.js') {
  const worker=new Worker(entry,{type:'module'});
  const pending=new Map();
  let resolveReady;
  const ready=new Promise(resolve=>resolveReady=resolve);
  worker.addEventListener('message',event=>{
    const data=event.data;
    if(data?.kind==='ready' || data?.kind==='init-failed') resolveReady(data);
    if(data?.kind==='reply') {
      let meta; try{meta=JSON.parse(data.frame)}catch{return;}
      const item=pending.get(meta.requestId);
      if(item){pending.delete(meta.requestId);item.resolve({meta,result:data.result});}
    } else if(data?.kind==='init-failed') {
      for(const item of pending.values()) item.reject(new Error(data.frame || 'init failed'));
      pending.clear();
    }
  });
  return {worker,ready,send:async(request,inputBytes)=>{
    const done=new Promise((resolve,reject)=>pending.set(request.requestId,{resolve,reject}));
    const envelope={kind:'request',frame:JSON.stringify(request)};
    if(inputBytes){const copy=inputBytes.slice();envelope.inputBytes=copy.buffer;worker.postMessage(envelope,[copy.buffer]);}
    else worker.postMessage(envelope);
    return await done;
  },cancel:(jobId)=>worker.postMessage({kind:'cancel',jobId})};
}
const makeIdentity=(document,scope)=>({token:1,sessionEpoch:1,documentId:document.id,boardId:scope.boardId,instanceId:scope.instanceId,revision:document.revision});
async function sha(bytes){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function prepare(core, document, scene, boardId, prefix){
  const contours=scene.boardContours.find(board=>board.boardId===boardId)?.contours || [];
  const resolved=await core.request({kind:'resolve-mechanical',id:`${prefix}-resolve`,document,contours});
  if(resolved.kind!=='mechanical-resolved') throw new Error(`${prefix} resolve failed: ${resolved.message||resolved.kind}`);
  const assembly=resolved.assembly;
  if(assembly.generationBlocked || assembly.diagnostics?.some(item=>item.severity==='error')) throw new Error(`${prefix} mechanical assembly blocked: ${(assembly.diagnostics||[]).map(item=>item.message).join('; ')}`);
  const prepared=await core.request({kind:'prepare-case',id:`${prefix}-prepare`,ir:assembly.case});
  if(prepared.kind!=='case-prepared') throw new Error(`${prefix} case prepare failed: ${prepared.message||prepared.kind}`);
  let bodies=[...prepared.ir.bodies];
  if(assembly.pcbReference){
    const reference=await core.request({kind:'prepare-case',id:`${prefix}-pcb`,ir:{revision:document.revision,bodies:[assembly.pcbReference]}});
    if(reference.kind!=='case-prepared') throw new Error(`${prefix} PCB prepare failed: ${reference.message||reference.kind}`);
    bodies.push(...reference.ir.bodies);
  } else if(document.mechanical){
    const config=document.mechanical;
    const body={id:'pcb-reference',name:'PCB reference — unpopulated',boardId:config.boardId,kind:'plate',thickness:config.pcbThickness,clearance:0,materialId:null,z:-config.pcbThickness,wallHeight:null,wallThickness:null,mounts:null,gasket:null,openings:null,features:null};
    const reference=await core.request({kind:'prepare-case',id:`${prefix}-pcb`,ir:{revision:document.revision,bodies:[{revision:document.revision,body,contours}]}});
    if(reference.kind!=='case-prepared') throw new Error(`${prefix} PCB prepare failed: ${reference.message||reference.kind}`);
    bodies.push(...reference.ir.bodies);
  }
  return {assembly:{revision:document.revision,bodies},bodyCount:bodies.length,sourceBodyCount:prepared.ir.bodies.length};
}
async function testFixture(file, boardId, instanceId, flipped, includeStep=true){
  const source=await json(`/assets/fixtures/${file}.json`);
  const projections=await json('/assets/fixtures/captured-projections.json');
  const record=projections.find(item=>item.fixture===file);
  const projection=record.projections.find(item=>item.scope.boardId===boardId && item.scope.instanceId===instanceId && item.scope.flipped===flipped);
  if(!projection) throw new Error(`projection fixture not found ${file}/${boardId}/${instanceId}/${flipped}`);
  const core=openCore(); await core.ready;
  const opened=await core.request({kind:'open',id:`open-${file}`,document:source});
  log(`${file} CoreWorker opened revision ${opened.scene.revision}`);
  if(opened.kind!=='scene') throw new Error(`${file} did not open through CoreWorker`);
  const doc=projection.document, scene=projection.scene;
  log(`${file}/${boardId} preparing captured case`);
  const prepared=await prepare(core,doc,scene,boardId,`prepare-${file}-${flipped}`);
  log(`${file}/${boardId} prepared ${prepared.bodyCount} CAD bodies`);
  if(!prepared.bodyCount) throw new Error(`${file}/${boardId} prepared no bodies`);
  const identity=makeIdentity(doc,{boardId,instanceId});
  const prefix=`${file}-${flipped?'flipped':'normal'}`;
  const cad=openCad();
  const ready=await cad.ready;
  if(ready.kind!=='ready') throw new Error(`CAD worker init failed: ${ready.frame}`);
  log(`${prefix} CAD worker ready`);
  const preview=await cad.send({requestId:`${prefix}-preview`,jobId:`${prefix}-preview-job`,identity,operation:'preview',prepared:prepared.assembly});
  log(`${prefix} preview ${preview.meta.outcome}`);
  if(preview.meta.outcome!=='completed' || !preview.result?.bodies?.length) throw new Error(`${prefix} preview failed: ${preview.meta.error}`);
  const exact=await cad.send({requestId:`${prefix}-exact`,jobId:`${prefix}-exact-job`,identity,operation:'exact',prepared:prepared.assembly});
  log(`${prefix} exact ${exact.meta.outcome}`);
  if(exact.meta.outcome!=='completed' || !exact.result?.mesh?.positions?.length || !exact.result?.step?.byteLength) throw new Error(`${prefix} exact failed: ${exact.meta.error}`);
  let step={hash:null,bytes:0,readbackVertices:0};
  if(includeStep){
    const fresh=openCad(); const freshReady=await fresh.ready;
    if(freshReady.kind!=='ready') throw new Error(`independent STEP worker failed init: ${freshReady.frame}`);
    const exported=await fresh.send({requestId:`${prefix}-step`,jobId:`${prefix}-step-job`,identity,operation:'export-step',prepared:prepared.assembly});
    if(exported.meta.outcome!=='completed' || !exported.result?.step?.byteLength) throw new Error(`${prefix} STEP failed: ${exported.meta.error}`);
    const exactHash=await sha(exact.result.step);
    const exportHash=await sha(exported.result.step);
    if(exactHash!==exportHash) throw new Error(`${prefix} independent STEP differs from exact STEP bytes`);
    const read=await fresh.send({requestId:`${prefix}-readback`,jobId:`${prefix}-readback-job`,identity,operation:'read-step'},exported.result.step);
    if(read.meta.outcome!=='completed' || !read.result?.mesh?.positions?.length) throw new Error(`${prefix} STEP readback failed: ${read.meta.error}`);
    step={hash:exportHash,bytes:exported.result.step.byteLength,readbackVertices:read.result.mesh.positions.length/3};
    fresh.worker.terminate();
  }
  const outcome={fixture:file,boardId,instanceId,flipped,revision:doc.revision,bodyCount:prepared.bodyCount,previewBodyCount:preview.result.bodies.length,previewVertices:preview.result.bodies.reduce((sum,b)=>sum+b.positions.length/3,0),exactVertices:exact.result.mesh.positions.length/3,step,providerRevision:exact.result.revision,openedRevision:opened.scene.revision};
  cad.worker.terminate(); core.worker.terminate();
  return outcome;
}
async function boundaryTests(){
  const bad=openCad('/assets/cad-worker/bad-entry.js');
  const badResult=await bad.ready;
  if(badResult.kind!=='init-failed') throw new Error('missing CAD module did not fail initialization');
  bad.worker.terminate();
  const cad=openCad(); const ready=await cad.ready;
  if(ready.kind!=='ready') throw new Error(`fresh CAD worker failed after prior init failure: ${JSON.stringify(ready)}`);
  const identity={token:1,sessionEpoch:1,documentId:'edge',boardId:'board',instanceId:null,revision:Number.MAX_SAFE_INTEGER};
  const safe=await cad.send({requestId:'safe-edge',jobId:'safe-edge-job',identity,operation:'preview',prepared:{revision:Number.MAX_SAFE_INTEGER,bodies:[]}});
  if(safe.meta.outcome!=='completed' || safe.result.revision!==Number.MAX_SAFE_INTEGER) throw new Error('MAX_SAFE_INTEGER was not preserved');
  const unsafeFrame='{"requestId":"wide-revision","jobId":"wide-revision-job","identity":{"token":1,"sessionEpoch":1,"documentId":"edge","boardId":"board","instanceId":null,"revision":9007199254740993},"operation":"preview","prepared":{"revision":9007199254740993,"bodies":[]}}';
  const unsafePromise=new Promise(resolve=>{
    const listener=event=>{if(event.data?.kind==='reply' && JSON.parse(event.data.frame).requestId==='wide-revision'){cad.worker.removeEventListener('message',listener);resolve(JSON.parse(event.data.frame));}};
    cad.worker.addEventListener('message',listener);
  });
  cad.worker.postMessage({kind:'request',frame:unsafeFrame});
  const unsafe=await unsafePromise;
  if(unsafe.outcome!=='failed' || !unsafe.error?.includes('exact JavaScript integer range')) throw new Error(`wide revision not rejected: ${JSON.stringify(unsafe)}`);
  cad.worker.terminate();
  return {badModule:'init-failed',freshWorker:'ready',safeRevision:identity.revision,safeOutcome:safe.meta.outcome,wideRevision:'9007199254740993',wideOutcome:unsafe.outcome,wideError:unsafe.error};
}
async function cancelTest(){
  const source=await json('/assets/fixtures/reviung41.json');
  const projections=await json('/assets/fixtures/captured-projections.json');
  const projection=projections.find(item=>item.fixture==='reviung41').projections.find(item=>item.scope.instanceId==='main' && item.scope.flipped===false);
  const core=openCore(); await core.ready; await core.request({kind:'open',id:'open-cancel',document:source});
  const prepared=await prepare(core,projection.document,projection.scene,'main','cancel');
  const cad=openCad(); const ready=await cad.ready;
  if(ready.kind!=='ready') throw new Error(`cancel worker failed init: ${ready.frame}`);
  const identity=makeIdentity(projection.document,{boardId:'main',instanceId:'main'});
  const promise=cad.send({requestId:'cancel-preview',jobId:'cancel-preview-job',identity,operation:'preview',prepared:prepared.assembly});
  setTimeout(()=>cad.cancel('cancel-preview-job'),0);
  const reply=await promise;
  if(reply.meta.outcome!=='cancelled') throw new Error(`cancellation not settled as cancelled: ${JSON.stringify(reply.meta)}`);
  cad.worker.terminate(); core.worker.terminate();
  return {requestId:reply.meta.requestId,outcome:reply.meta.outcome,error:reply.meta.error};
}
document.querySelector('#flip').addEventListener('click',async()=>{
  out.textContent='Running flipped REVIUNG independent STEP/readback…';
  try{const result=await testFixture('reviung41','main','main',true,true);window.__M1_FLIPPED_STEP__=result;log(`RESULT ${JSON.stringify(result)}`);}catch(error){window.__M1_FLIPPED_STEP__={error:String(error),stack:error?.stack};log(`FAILED ${error?.stack||error}`);}
});
document.querySelector('#run').addEventListener('click',async()=>{
  out.textContent='Running current staged CoreWorker + independent CAD worker proof…';
  try{
    const boundary=await boundaryTests(); log(`boundary ${JSON.stringify(boundary)}`);
    const results=[];
    results.push(await testFixture('reviung41','main','main',false,true)); log(`fixture ${JSON.stringify(results.at(-1))}`);
    results.push(await testFixture('reviung41','main','main',true,false)); log(`fixture ${JSON.stringify(results.at(-1))}`);
    results.push(await testFixture('sofle','left',null,null,true)); log(`fixture ${JSON.stringify(results.at(-1))}`);
    const cancelled=await cancelTest(); log(`cancel ${JSON.stringify(cancelled)}`);
    const report={boundary,fixtures:results,cancelled,completedAt:new Date().toISOString()};
    window.__M1_CAD_PROOF__=report; log(`RESULT ${JSON.stringify(report)}`);
  }catch(error){window.__M1_CAD_PROOF__={error:String(error),stack:error?.stack}; log(`FAILED ${error?.stack||error}`);}
});
</script></body></html>
