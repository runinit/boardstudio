[package]
name = "p2-lifecycle-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "p2-lifecycle-probe"
path = "src/main.rs"

[dependencies]
boardstudio_core = { path = "../../../../core" }
boardstudio-p1-core = { path = "../../p1-core" }
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "minimal", "mounted", "asset"] }
dioxus-web = { version = "=0.7.10", default-features = false, features = ["mounted"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-wasm-bindgen = "=0.6.5"
gloo-timers = { version = "=0.3.0", features = ["futures"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Document", "Location", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "DedicatedWorkerGlobalScope", "ResizeObserver", "ResizeObserverEntry", "MediaQueryList", "Element", "Event", "EventTarget", "FocusEvent", "HtmlCanvasElement", "HtmlElement", "KeyboardEvent", "Node", "PointerEvent", "SvgElement", "Window", "console"] }
