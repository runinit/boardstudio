[package]
name = "boardstudio-p1-core"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["host"]
host = ["dep:dioxus", "dep:gloo-timers"]
worker = []

[dependencies]
boardstudio_core = { path = "../../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web", "mounted"], optional = true }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Location", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "DedicatedWorkerGlobalScope", "Event"] }
serde-wasm-bindgen = "=0.6.5"
gloo-timers = { version = "=0.3.0", features = ["futures"], optional = true }
