[package]
name = "p3-durability-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["page"]
page = ["dep:boardstudio_core", "dep:serde", "dep:serde_json", "dep:sha2"]
service-worker = []

[dependencies]
boardstudio_core = { path = "../../../core", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "=0.11.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
  "Cache",
  "CacheStorage",
  "Clients",
  "DomStringList",
  "Event",
  "EventTarget",
  "ExtendableEvent",
  "FetchEvent",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbObjectStoreParameters",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "Request",
  "Response",
  "ServiceWorkerGlobalScope",
  "ServiceWorkerRegistration",
  "WorkerGlobalScope",
  "Window",
] }
