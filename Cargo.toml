[workspace]
resolver = "3"
members = [
  "application",
  "contracts/rust",
  "core",
  "core/crates/*",
  "footprints",
  "renderer",
  "web",
  "web/crates/host",
  "web/crates/runtime",
  "web/crates/ui-model",
  "web/crates/catalogue",
  "web/crates/ui-shared",
  "web/crates/layout",
  "web/crates/pcb",
  "web/crates/parts",
  "web/crates/case",
  "web/crates/keymap",
  "web/crates/library",
  "web/crates/keycaps",
]
# The CAD workspace owns the lockfile and patched Monstertruck dependency graph.
exclude = [
  "cad/monstertruck",
  "cad/wasm",
  "renderer/vendor/cgmath-next-0.18.1",
  "web/vendor/dioxus-interpreter-js-0.7.10",
]

[workspace.dependencies]
# One web-sys feature list for every web crate. Cargo compiles web-sys, and everything built on it
# such as dioxus-web, once per distinct feature set, so per-crate lists made each crate's
# `wasm-pack test` build its own copy instead of reusing the page build's units. The list is
# everything the page and the renderer resolve on wasm32 (including what dioxus-web, dioxus-primitives
# and three-d turn on), so the page, the workers and the renderer all build one web-sys.
web-sys = { version = "=0.3.106", features = [
  "AbortSignal", "AngleInstancedArrays", "AnimationEvent", "Blob", "BlobPropertyBag", "Cache",
  "CacheStorage", "CharacterData", "Client", "ClientQueryOptions", "ClientType", "Clients",
  "ClipboardEvent", "CloseEvent", "Comment", "CompositionEvent", "CssStyleDeclaration",
  "CustomEvent", "DataTransfer", "DataTransferItem", "DataTransferItemList",
  "DedicatedWorkerGlobalScope", "Document", "DomException", "DomRect", "DomRectReadOnly",
  "DragEvent", "Element", "ErrorEvent", "Event", "EventInit", "EventTarget", "ExtBlendMinmax",
  "ExtColorBufferFloat", "ExtColorBufferHalfFloat", "ExtDisjointTimerQuery", "ExtFragDepth",
  "ExtSRgb", "ExtShaderTextureLod", "ExtTextureFilterAnisotropic", "ExtendableEvent",
  "ExtendableMessageEvent", "FetchEvent", "File", "FileList", "FileReader", "FocusEvent",
  "FocusOptions", "FormData", "Headers", "History", "HtmlAnchorElement", "HtmlCanvasElement",
  "HtmlDialogElement", "HtmlElement", "HtmlFormElement", "HtmlHeadElement", "HtmlImageElement",
  "HtmlInputElement", "HtmlMediaElement", "HtmlSelectElement", "HtmlTextAreaElement",
  "HtmlVideoElement", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbObjectStoreParameters",
  "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "ImageBitmap",
  "ImageData", "InputEvent", "IntersectionObserverEntry", "KeyboardEvent", "KeyboardEventInit",
  "Location", "MediaQueryList", "MessageChannel", "MessageEvent", "MessagePort", "MouseEvent",
  "MutationObserver", "MutationObserverInit", "Navigator", "Node", "NodeList",
  "OesElementIndexUint", "OesStandardDerivatives", "OesTextureFloat", "OesTextureFloatLinear",
  "OesTextureHalfFloat", "OesTextureHalfFloatLinear", "OesVertexArrayObject", "OvrMultiview2",
  "PointerEvent", "PointerEventInit", "QueuingStrategy", "ReadableByteStreamController",
  "ReadableStream", "ReadableStreamByobReader", "ReadableStreamByobRequest",
  "ReadableStreamDefaultController", "ReadableStreamDefaultReader",
  "ReadableStreamGetReaderOptions", "ReadableStreamReadResult", "ReadableStreamReaderMode",
  "ReadableStreamType", "ReadableWritablePair", "RegistrationOptions", "Request",
  "RequestDestination", "RequestInit", "ResizeObserver", "ResizeObserverEntry",
  "ResizeObserverSize", "Response", "ResponseType", "ScrollBehavior", "ScrollIntoViewOptions",
  "ScrollLogicalPosition", "ScrollRestoration", "ScrollToOptions", "ServiceWorker",
  "ServiceWorkerContainer", "ServiceWorkerGlobalScope", "ServiceWorkerRegistration", "Storage",
  "StreamPipeOptions", "SvgElement", "Text", "Touch", "TouchEvent", "TouchList",
  "TransformStream", "TransformStreamDefaultController", "Transformer", "TransitionEvent",
  "UiEvent", "UnderlyingSink", "UnderlyingSource", "Url", "VideoFrame", "WebGl2RenderingContext",
  "WebGlActiveInfo", "WebGlBuffer", "WebGlFramebuffer", "WebGlProgram", "WebGlQuery",
  "WebGlRenderbuffer", "WebGlRenderingContext", "WebGlSampler", "WebGlShader",
  "WebGlShaderPrecisionFormat", "WebGlSync", "WebGlTexture", "WebGlTransformFeedback",
  "WebGlUniformLocation", "WebGlVertexArrayObject", "WebSocket", "WebglColorBufferFloat",
  "WebglCompressedTextureAstc", "WebglCompressedTextureEtc", "WebglCompressedTextureEtc1",
  "WebglCompressedTexturePvrtc", "WebglCompressedTextureS3tc", "WebglCompressedTextureS3tcSrgb",
  "WebglDebugRendererInfo", "WebglDebugShaders", "WebglDepthTexture", "WebglDrawBuffers",
  "WebglLoseContext", "WheelEvent", "Window", "Worker", "WorkerGlobalScope", "WorkerOptions",
  "WorkerType", "WritableStream", "WritableStreamDefaultController",
  "WritableStreamDefaultWriter", "console"
] }

[patch.crates-io]
cgmath = { path = "renderer/vendor/cgmath-next-0.18.1" }
dioxus-interpreter-js = { path = "web/vendor/dioxus-interpreter-js-0.7.10" }

# `dx serve` builds the page with this profile. Full debuginfo made the debug wasm
# about 550 MB, and dx's `wasm-bindgen --keep-debug` pass over it took about 52 s of a
# 78 s rebuild. Line tables keep file:line for browser DWARF debugging and halve the
# rebuild. Set `debug = true` here locally to inspect variables in the debugger.
# Lints every workspace crate inherits (`[lints] workspace = true`). `scripts/check.py lint`
# runs Clippy with warnings denied, so a lint that is intentionally off belongs here, with its
# reason, rather than in a command-line flag.
[workspace.lints.clippy]
# The large variants are UI and session state enums that are built once and moved rarely;
# boxing them would change every construction and match site for no measured gain.
large_enum_variant = "allow"

# Keep DWARF off by default for dev/test builds so direct `cargo test` and `wasm-pack test`
# match `scripts/run-wasm-tests.py` (`CARGO_PROFILE_DEV_DEBUG=false`), avoiding 700+ MB
# debug WASM binaries, browser memory traps, and full-workspace cache invalidations.
[profile.dev]
debug = false

[profile.wasm-dev]
inherits = "dev"
debug = "line-tables-only"

# Optimize only runtime-hot dependencies; leave other dependencies and proc macros fast to build.
[profile.dev.package]
flate2 = { opt-level = 2 }
zlib-rs = { opt-level = 2 }
zip = { opt-level = 2 }
crc32fast = { opt-level = 2 }
sha2 = { opt-level = 2 }
serde_json = { opt-level = 2 }
three-d = { opt-level = 2 }
three-d-asset = { opt-level = 2 }
i_overlay = { opt-level = 2 }
lyon_tessellation = { opt-level = 2 }
lyon_path = { opt-level = 2 }
lyon_geom = { opt-level = 2 }
cgmath = { opt-level = 2 }
num-bigint = { opt-level = 2 }
num-rational = { opt-level = 2 }
regex-automata = { opt-level = 1 }
regex-syntax = { opt-level = 1 }
aho-corasick = { opt-level = 1 }
# Static builds avoid Dioxus hot-reload scaffolding; wasm-dev restores it for dx serve.
# Do NOT add dioxus-cli-config (or "*") here: dioxus-cli-config reads
# <meta name="DIOXUS_ASSET_ROOT"> at runtime only under cfg(debug_assertions), which
# plain-Cargo subpath builds rely on.
boardstudio-web = { debug-assertions = false }
boardstudio-web-ui-shared = { debug-assertions = false }
boardstudio-web-keycaps = { debug-assertions = false }
boardstudio-web-case = { debug-assertions = false }
boardstudio-web-parts = { debug-assertions = false }
boardstudio-web-layout = { debug-assertions = false }
boardstudio-web-pcb = { debug-assertions = false }
boardstudio-web-keymap = { debug-assertions = false }
boardstudio-web-library = { debug-assertions = false }
dioxus-web = { debug-assertions = false }

[profile.wasm-dev.package.boardstudio-web]
debug-assertions = true
[profile.wasm-dev.package.boardstudio-web-ui-shared]
debug-assertions = true
[profile.wasm-dev.package.boardstudio-web-keycaps]
debug-assertions = true
[profile.wasm-dev.package.boardstudio-web-case]
debug-assertions = true
[profile.wasm-dev.package.boardstudio-web-parts]
debug-assertions = true
[profile.wasm-dev.package.boardstudio-web-layout]
debug-assertions = true
[profile.wasm-dev.package.boardstudio-web-pcb]
debug-assertions = true
[profile.wasm-dev.package.boardstudio-web-keymap]
debug-assertions = true
[profile.wasm-dev.package.boardstudio-web-library]
debug-assertions = true
[profile.wasm-dev.package.dioxus-web]
debug-assertions = true

[profile.lint]
inherits = "dev"
incremental = false

# The profile for every wasm build `scripts/check.py` makes: the packaged page
# (`build-web.py --fast`), the page tests and each crate's `wasm-pack test`. With the wasm rustflags
# in .cargo/config.toml and dx run with `--wasm-js-cfg false`, those builds reuse each other's
# dependency and proc-macro units instead of compiling the graph once per tool. `dx serve` keeps
# `wasm-dev`, with line tables and hot reload.
[profile.wasm-check]
inherits = "dev"
# A check compiles each crate once; incremental bookkeeping made those cold builds about a third slower.
incremental = false
