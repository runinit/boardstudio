[workspace]
resolver = "3"
members = [
  "application",
  "contracts/rust",
  "core",
  "core/crates/*",
  "footprints",
  "renderer",
  "web",
  "web/crates/host",
  "web/crates/runtime",
  "web/crates/ui-model",
  "web/crates/catalogue",
  "web/crates/ui-shared",
  "web/crates/layout",
  "web/crates/pcb",
  "web/crates/parts",
  "web/crates/case",
  "web/crates/keymap",
  "web/crates/library",
  "web/crates/keycaps",
]
# The CAD workspace owns the lockfile and patched Monstertruck dependency graph.
exclude = [
  "cad/monstertruck",
  "cad/wasm",
  "renderer/vendor/cgmath-next-0.18.1",
  "web/vendor/dioxus-interpreter-js-0.7.10",
]

[workspace.dependencies]
# One web-sys feature list for every web crate. Cargo compiles web-sys, and everything built on it
# such as dioxus-web, once per distinct feature set, so per-crate lists made each crate's
# `wasm-pack test` build its own copy instead of reusing the page build's units.
web-sys = { version = "=0.3.106", features = [
  "Blob", "BlobPropertyBag", "Cache", "CacheStorage", "Client", "ClientQueryOptions", "ClientType",
  "Clients", "CssStyleDeclaration", "DedicatedWorkerGlobalScope", "Document", "DomException",
  "DomRect", "Element", "ErrorEvent", "Event", "EventInit", "EventTarget", "ExtendableEvent",
  "ExtendableMessageEvent", "FetchEvent", "File", "FileList", "FocusOptions", "HtmlAnchorElement",
  "HtmlCanvasElement", "HtmlDialogElement", "HtmlElement", "HtmlInputElement", "IdbDatabase",
  "IdbFactory", "IdbObjectStore", "IdbObjectStoreParameters", "IdbOpenDbRequest", "IdbRequest",
  "IdbTransaction", "IdbTransactionMode", "KeyboardEvent", "KeyboardEventInit", "Location",
  "MediaQueryList", "MessageChannel", "MessageEvent", "MessagePort", "MutationObserver",
  "MutationObserverInit", "Navigator", "Node", "NodeList", "PointerEvent", "PointerEventInit",
  "RegistrationOptions", "Request", "RequestDestination", "ResizeObserver", "Response",
  "ServiceWorker", "ServiceWorkerContainer", "ServiceWorkerGlobalScope",
  "ServiceWorkerRegistration", "Storage", "SvgElement", "Url", "Window", "Worker",
  "WorkerGlobalScope", "WorkerOptions", "WorkerType"
] }

[patch.crates-io]
cgmath = { path = "renderer/vendor/cgmath-next-0.18.1" }
dioxus-interpreter-js = { path = "web/vendor/dioxus-interpreter-js-0.7.10" }

# `dx serve` builds the page with this profile. Full debuginfo made the debug wasm
# about 550 MB, and dx's `wasm-bindgen --keep-debug` pass over it took about 52 s of a
# 78 s rebuild. Line tables keep file:line for browser DWARF debugging and halve the
# rebuild. Set `debug = true` here locally to inspect variables in the debugger.
# Lints every workspace crate inherits (`[lints] workspace = true`). `scripts/check.py lint`
# runs Clippy with warnings denied, so a lint that is intentionally off belongs here, with its
# reason, rather than in a command-line flag.
[workspace.lints.clippy]
# The large variants are UI and session state enums that are built once and moved rarely;
# boxing them would change every construction and match site for no measured gain.
large_enum_variant = "allow"

# Keep DWARF off by default for dev/test builds so direct `cargo test` and `wasm-pack test`
# match `scripts/run-wasm-tests.py` (`CARGO_PROFILE_DEV_DEBUG=false`), avoiding 700+ MB
# debug WASM binaries, browser memory traps, and full-workspace cache invalidations.
[profile.dev]
debug = false

[profile.wasm-dev]
inherits = "dev"
debug = "line-tables-only"

# Dependencies compile once, so optimizing them is free after the first build, and tests that
# hash, compress or parse (the demo-project acceptance test) run about 2.4x faster. The
# workspace's own crates stay unoptimized so edit-and-test builds stay quick.
[profile.dev.package]
"*" = { opt-level = 2 }
# Proc macros and the libraries only they use run inside the compiler, never in a test or the
# page. "*" gave them opt-level 2 too, and their LLVM time sat on every cold build's critical
# path: syn alone took 15 s, and Core could not start until 40 s in. At opt-level 0 the cold
# wasm page build went from 85 s to 68 s and expansion got no slower (Core's type-check, which
# expands every serde derive, took 15.4 s instead of 16.8 s). A named package overrides "*".
async-stream-impl = { opt-level = 0 }
async-trait = { opt-level = 0 }
const-random-macro = { opt-level = 0 }
const-serialize-macro = { opt-level = 0 }
const_format_proc_macros = { opt-level = 0 }
convert_case = { opt-level = 0 }
darling = { opt-level = 0 }
darling_core = { opt-level = 0 }
darling_macro = { opt-level = 0 }
derive_more-impl = { opt-level = 0 }
dioxus-attributes = { opt-level = 0 }
dioxus-config-macro = { opt-level = 0 }
dioxus-core-macro = { opt-level = 0 }
dioxus-fullstack-macro = { opt-level = 0 }
dioxus-html-internal-macro = { opt-level = 0 }
dioxus-rsx = { opt-level = 0 }
dioxus-stores-macro = { opt-level = 0 }
displaydoc = { opt-level = 0 }
enumset_derive = { opt-level = 0 }
futures-macro = { opt-level = 0 }
heck = { opt-level = 0 }
ident_case = { opt-level = 0 }
macro-string = { opt-level = 0 }
manganis-macro = { opt-level = 0 }
multiversion_no_op = { opt-level = 0 }
open-enum-derive = { opt-level = 0 }
palette_derive = { opt-level = 0 }
pin-project-internal = { opt-level = 0 }
proc-macro2 = { opt-level = 0 }
proc-macro2-diagnostics = { opt-level = 0 }
quote = { opt-level = 0 }
rhai_codegen = { opt-level = 0 }
rustversion = { opt-level = 0 }
serde_derive = { opt-level = 0 }
sledgehammer_bindgen_macro = { opt-level = 0 }
strum_macros = { opt-level = 0 }
syn = { opt-level = 0 }
synstructure = { opt-level = 0 }
thiserror-impl = { opt-level = 0 }
time-macros = { opt-level = 0 }
tokio-macros = { opt-level = 0 }
tracing-attributes = { opt-level = 0 }
warnings-macro = { opt-level = 0 }
wasm-bindgen-macro = { opt-level = 0 }
wasm-bindgen-macro-support = { opt-level = 0 }
wasm-bindgen-test-macro = { opt-level = 0 }
yoke-derive = { opt-level = 0 }
zerocopy-derive = { opt-level = 0 }
zerofrom-derive = { opt-level = 0 }
zerovec-derive = { opt-level = 0 }

# The profile for every wasm build `scripts/check.py` makes: the packaged page
# (`build-web.py --fast`), the page tests and each crate's `wasm-pack test`. With the wasm rustflags
# in .cargo/config.toml and dx run with `--wasm-js-cfg false`, those builds reuse each other's
# dependency and proc-macro units instead of compiling the graph once per tool. `dx serve` keeps
# `wasm-dev`, with line tables and hot reload.
[profile.wasm-check]
inherits = "dev"
# A check compiles each crate once; incremental bookkeeping made those cold builds about a third slower.
incremental = false

# Dioxus 0.7 compiles hot-reload scaffolding into every `rsx!` template when debug assertions are on.
# Only `dx serve` uses it. These crates have no `debug_assert!` or `cfg(debug_assertions)` of their
# own, so here it only costs compile time.
[profile.wasm-check.package.boardstudio-web]
debug-assertions = false
[profile.wasm-check.package.boardstudio-web-ui-shared]
debug-assertions = false
[profile.wasm-check.package.boardstudio-web-keycaps]
debug-assertions = false
[profile.wasm-check.package.boardstudio-web-case]
debug-assertions = false
[profile.wasm-check.package.boardstudio-web-parts]
debug-assertions = false
[profile.wasm-check.package.boardstudio-web-layout]
debug-assertions = false
[profile.wasm-check.package.boardstudio-web-pcb]
debug-assertions = false
[profile.wasm-check.package.boardstudio-web-keymap]
debug-assertions = false
[profile.wasm-check.package.boardstudio-web-library]
debug-assertions = false
