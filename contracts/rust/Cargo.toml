[package]
name = "boardstudio-contracts"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
export-types = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-compat", "serde-json-impl"] }
